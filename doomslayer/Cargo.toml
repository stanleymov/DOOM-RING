[package]
name = "doomslayer"
version = "0.1.0"
edition = "2024"
publish = false
description = "DOOM RING: Doom Eternal mechanics inside Elden Ring (personal mod)"

[lib]
crate-type = ["cdylib"]

[dependencies]
eldenring.path = "../erfps2/fromsoftware-rs/crates/eldenring"
fromsoftware-shared.path = "../erfps2/fromsoftware-rs/crates/shared"
glam = "0.33.4"
log = "0.4.28"
simplelog = { version = "0.12.2", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
toml = "1.1.4"
pelite = "0.10.0"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_SystemServices",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Threading",
    "Win32_System_Memory",
] }

hudhook = { path = "../vendor/hudhook", default-features = false, features = ["dx12", "imgui-tables-api"] }

rodio = { version = "0.20", default-features = false, features = ["wav", "vorbis"] }
fastrand = "2"
png = "0.17"

[features]
hud = []

[profile.release]
panic = "abort"
opt-level = 3
codegen-units = 1
lto = true
